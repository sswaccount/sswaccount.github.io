<svg xmlns="http://www.w3.org/2000/svg" width="600" height="620" viewBox="0 0 600 620" role="img" aria-labelledby="title desc">
<title id="title">平面图与互补生成树</title><desc id="desc">外方框 ABCD，内方框 abcd，对应顶点相连。蓝色树为 AB BC CD Aa Bb Cc Dd；橙色对偶树连接中心面与四周面，再由左面连至无界面。</desc>
<rect width="600" height="620" rx="16" fill="#ffffff"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="300" y="35" font-size="24" fill="#243447" text-anchor="middle">从内外方框，到两棵生成树</text><polygon points="100,100 500,100 380,220 220,220" fill="#eff6ff"/><polygon points="500,100 500,500 380,380 380,220" fill="#f0fdfa"/><polygon points="500,500 100,500 220,380 380,380" fill="#fff7ed"/><polygon points="100,500 100,100 220,220 220,380" fill="#f5f3ff"/><polygon points="220,220 380,220 380,380 220,380" fill="#fff5e6"/><line x1="100" y1="100" x2="500" y2="100" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><line x1="500" y1="100" x2="500" y2="500" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><line x1="500" y1="500" x2="100" y2="500" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><line x1="100" y1="500" x2="100" y2="100" stroke="#a6b0be" stroke-width="2.5" stroke-linecap="round"/><line x1="220" y1="220" x2="380" y2="220" stroke="#a6b0be" stroke-width="2.5" stroke-linecap="round"/><line x1="380" y1="220" x2="380" y2="380" stroke="#a6b0be" stroke-width="2.5" stroke-linecap="round"/><line x1="380" y1="380" x2="220" y2="380" stroke="#a6b0be" stroke-width="2.5" stroke-linecap="round"/><line x1="220" y1="380" x2="220" y2="220" stroke="#a6b0be" stroke-width="2.5" stroke-linecap="round"/><line x1="100" y1="100" x2="220" y2="220" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><line x1="500" y1="100" x2="380" y2="220" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><line x1="500" y1="500" x2="380" y2="380" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><line x1="100" y1="500" x2="220" y2="380" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><line x1="300" y1="300" x2="300" y2="155" stroke="#c65b0b" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 6"/><line x1="300" y1="300" x2="445" y2="300" stroke="#c65b0b" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 6"/><line x1="300" y1="300" x2="300" y2="445" stroke="#c65b0b" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 6"/><line x1="300" y1="300" x2="155" y2="300" stroke="#c65b0b" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 6"/><line x1="155" y1="300" x2="35" y2="300" stroke="#c65b0b" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 6"/><circle cx="300" cy="300" r="6" fill="#c65b0b" stroke="white" stroke-width="2"/><circle cx="300" cy="155" r="6" fill="#c65b0b" stroke="white" stroke-width="2"/><circle cx="445" cy="300" r="6" fill="#c65b0b" stroke="white" stroke-width="2"/><circle cx="300" cy="445" r="6" fill="#c65b0b" stroke="white" stroke-width="2"/><circle cx="155" cy="300" r="6" fill="#c65b0b" stroke="white" stroke-width="2"/><circle cx="35" cy="300" r="6" fill="#c65b0b" stroke="white" stroke-width="2"/><text x="328" y="282" font-size="22" fill="#9a4307" text-anchor="middle">f₀</text><text x="300" y="137" font-size="22" fill="#9a4307" text-anchor="middle">f₁</text><text x="445" y="330" font-size="22" fill="#9a4307" text-anchor="middle">f₂</text><text x="300" y="475" font-size="22" fill="#9a4307" text-anchor="middle">f₃</text><text x="155" y="330" font-size="22" fill="#9a4307" text-anchor="middle">f₄</text><text x="35" y="330" font-size="22" fill="#9a4307" text-anchor="middle">f∞</text><circle cx="100" cy="100" r="5" fill="#243447" stroke="white" stroke-width="2"/><text x="83" y="87" font-size="21" fill="#243447" text-anchor="middle">A</text><circle cx="500" cy="100" r="5" fill="#243447" stroke="white" stroke-width="2"/><text x="517" y="87" font-size="21" fill="#243447" text-anchor="middle">B</text><circle cx="500" cy="500" r="5" fill="#243447" stroke="white" stroke-width="2"/><text x="517" y="525" font-size="21" fill="#243447" text-anchor="middle">C</text><circle cx="100" cy="500" r="5" fill="#243447" stroke="white" stroke-width="2"/><text x="83" y="525" font-size="21" fill="#243447" text-anchor="middle">D</text><circle cx="220" cy="220" r="5" fill="#243447" stroke="white" stroke-width="2"/><text x="240" y="250" font-size="21" fill="#243447" text-anchor="middle">a</text><circle cx="380" cy="220" r="5" fill="#243447" stroke="white" stroke-width="2"/><text x="360" y="250" font-size="21" fill="#243447" text-anchor="middle">b</text><circle cx="380" cy="380" r="5" fill="#243447" stroke="white" stroke-width="2"/><text x="360" y="364" font-size="21" fill="#243447" text-anchor="middle">c</text><circle cx="220" cy="380" r="5" fill="#243447" stroke="white" stroke-width="2"/><text x="240" y="364" font-size="21" fill="#243447" text-anchor="middle">d</text><line x1="45" y1="561" x2="78" y2="561" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><text x="88" y="567" font-size="17" fill="#243447" text-anchor="start">原图树 T：7 条边</text><line x1="320" y1="561" x2="353" y2="561" stroke="#c65b0b" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 6"/><text x="363" y="567" font-size="17" fill="#243447" text-anchor="start">对偶树 T*：5 条边</text><text x="300" y="599" font-size="16" fill="#66758b" text-anchor="middle">橙色边只跨过灰色非树边；交叉点不是顶点</text></g></svg>