<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
<title id="title">两棵生成树的独立视图</title><desc id="desc">左侧是原图的八顶点七边生成树；右侧是以六个面为顶点的五边对偶生成树。</desc>
<rect width="1000" height="410" rx="16" fill="#ffffff"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="250" y="38" font-size="23" fill="#243447" text-anchor="middle">连接 8 个原图顶点</text><text x="750" y="38" font-size="23" fill="#243447" text-anchor="middle">连接 6 个面</text><line x1="300" y1="115" x2="405" y2="115" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><line x1="405" y1="115" x2="405" y2="245" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><line x1="195" y1="115" x2="195" y2="245" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><line x1="195" y1="115" x2="300" y2="115" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><line x1="90" y1="115" x2="195" y2="115" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><line x1="300" y1="115" x2="300" y2="245" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><line x1="90" y1="115" x2="90" y2="245" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><line x1="750" y1="180" x2="750" y2="95" stroke="#c65b0b" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 6"/><line x1="750" y1="180" x2="880" y2="180" stroke="#c65b0b" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 6"/><line x1="750" y1="180" x2="750" y2="265" stroke="#c65b0b" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 6"/><line x1="750" y1="180" x2="645" y2="180" stroke="#c65b0b" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 6"/><line x1="645" y1="180" x2="555" y2="180" stroke="#c65b0b" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 6"/><circle cx="90" cy="115" r="6" fill="#2563eb" stroke="white" stroke-width="2"/><text x="90" y="97" font-size="20" fill="#243447" text-anchor="middle">A</text><circle cx="195" cy="115" r="6" fill="#2563eb" stroke="white" stroke-width="2"/><text x="195" y="97" font-size="20" fill="#243447" text-anchor="middle">B</text><circle cx="300" cy="115" r="6" fill="#2563eb" stroke="white" stroke-width="2"/><text x="300" y="97" font-size="20" fill="#243447" text-anchor="middle">C</text><circle cx="405" cy="115" r="6" fill="#2563eb" stroke="white" stroke-width="2"/><text x="405" y="97" font-size="20" fill="#243447" text-anchor="middle">D</text><circle cx="90" cy="245" r="6" fill="#2563eb" stroke="white" stroke-width="2"/><text x="90" y="275" font-size="20" fill="#243447" text-anchor="middle">a</text><circle cx="195" cy="245" r="6" fill="#2563eb" stroke="white" stroke-width="2"/><text x="195" y="275" font-size="20" fill="#243447" text-anchor="middle">b</text><circle cx="300" cy="245" r="6" fill="#2563eb" stroke="white" stroke-width="2"/><text x="300" y="275" font-size="20" fill="#243447" text-anchor="middle">c</text><circle cx="405" cy="245" r="6" fill="#2563eb" stroke="white" stroke-width="2"/><text x="405" y="275" font-size="20" fill="#243447" text-anchor="middle">d</text><circle cx="750" cy="180" r="6" fill="#c65b0b" stroke="white" stroke-width="2"/><text x="780" y="162" font-size="20" fill="#243447" text-anchor="middle">f₀</text><circle cx="750" cy="95" r="6" fill="#c65b0b" stroke="white" stroke-width="2"/><text x="750" y="78" font-size="20" fill="#243447" text-anchor="middle">f₁</text><circle cx="880" cy="180" r="6" fill="#c65b0b" stroke="white" stroke-width="2"/><text x="880" y="163" font-size="20" fill="#243447" text-anchor="middle">f₂</text><circle cx="750" cy="265" r="6" fill="#c65b0b" stroke="white" stroke-width="2"/><text x="750" y="294" font-size="20" fill="#243447" text-anchor="middle">f₃</text><circle cx="645" cy="180" r="6" fill="#c65b0b" stroke="white" stroke-width="2"/><text x="645" y="163" font-size="20" fill="#243447" text-anchor="middle">f₄</text><circle cx="555" cy="180" r="6" fill="#c65b0b" stroke="white" stroke-width="2"/><text x="555" y="163" font-size="20" fill="#243447" text-anchor="middle">f∞</text><text x="250" y="329" font-size="22" fill="#2563eb" text-anchor="middle">|E(T)| = 8 − 1 = 7</text><text x="750" y="329" font-size="22" fill="#9a4307" text-anchor="middle">|E(T*)| = 6 − 1 = 5</text><text x="500" y="377" font-size="24" fill="#243447" text-anchor="middle">12 = 7 + 5 = (8 − 1) + (6 − 1)</text></g></svg>